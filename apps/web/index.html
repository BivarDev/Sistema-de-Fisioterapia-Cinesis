<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinesis — gestão para fisioterapia</title>
    <meta
      name="description"
      content="Sistema livre e gratuito que transforma o tratamento fisioterapêutico numa linha do tempo mensurável."
    />

    <!--
      Icone da aba, em SVG dentro de um data URI.

      Inline por dois motivos: nao gera a requisicao extra do favicon.ico
      (que sem isto responde 404) e nao depende de um binario no repositorio.
      O desenho e a curva ascendente com o ponto no fim — a evolucao clinica.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6b6b'/%3E%3Cpath d='M7 23C11 23 12 9 19 9' stroke='%23d9f2ee' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='23.5' cy='9' r='2.6' fill='%23e8934a'/%3E%3C/svg%3E" />

    <!-- Fontes: pre-conexao antes do link do CSS economiza um RTT completo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Evita o "flash" de tema errado.

      O React so monta depois de baixar e avaliar o bundle. Sem este script, a
      pagina pinta clara por alguns quadros antes de o tema noturno ser aplicado
      — o que e desagradavel sempre e ofuscante num ambiente escuro.

      Roda antes de qualquer pintura porque esta no `<head>`, e e minusculo.
    -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('cinesis:tema');
          var escuro =
            tema === 'escuro' ||
            (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.dataset.theme = 'dark';
          if (tema === 'claro') document.documentElement.dataset.theme = 'light';

          var mov = localStorage.getItem('cinesis:motion');
          if (!mov) {
            mov = window.matchMedia('(prefers-reduced-motion: reduce)').matches
              ? 'reduzidas'
              : 'completas';
          }
          document.documentElement.dataset.motion = mov;
        } catch (e) {
          /* localStorage indisponivel: segue com o padrao do CSS. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
